name: agrocontabil

# Ambiente de demonstracao na VPS (Oracle Cloud, Ampere A1 arm64). Fica em /opt/agrocontabil ao lado
# do .env, do Caddyfile e de certs/. As imagens do backend e do frontend vem do GHCR, publicadas pelos
# workflows docker-publish.yml de cada repositorio. Atualizar: docker compose pull && docker compose up -d
#
# Profile homolog: so o JWT do login autentica (sem o mock do X-Usuario-Id, #221), com segredo JWT e
# chave de cifra proprios do .env. Desde o login do frontend (frontend#93) o Caddy nao pede senha.
# So dados ficticios aqui: o certificado da NF-e e o de teste (publico) e a SEFAZ e o mock.

# Rotacao dos logs de todo servico: o json-file padrao do Docker cresce sem limite e enche o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

networks:
  interna:

volumes:
  pgdata:
  ollama:
  clamav:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agrocontabil}
      POSTGRES_USER: ${DB_USER:-agrocontabil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-agrocontabil} -d ${DB_NAME:-agrocontabil}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Sem porta publicada: o Ollama nao tem autenticacao. O backend chega por http://ollama:11434.
  ollama:
    image: ollama/ollama:0.35.0
    logging: *logging
    restart: unless-stopped
    environment:
      # Uma pergunta por vez em CPU (o bulkhead do backend ja limita) e modelo sempre carregado.
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    networks: [interna]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

  # Baixa bge-m3 + modelo de chat na primeira subida (~4 GB) e termina.
  ollama-init:
    image: ollama/ollama:0.35.0
    logging: *logging
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b-instruct}
    # O modelo de chat so e baixado quando o chat e local; com a API da Anthropic ele nao e usado.
    # O bge-m3 (embedding) e sempre local.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama pull bge-m3 &&
        if [ "$$AI_CHAT_PROVIDER" = "ollama" ]; then ollama pull "$$AI_CHAT_MODEL"; fi
    networks: [interna]
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  # Variante Debian: a clamav/clamav (Alpine) nao publica arm64.
  clamav:
    image: clamav/clamav-debian:1.4.3
    logging: *logging
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    networks: [interna]
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    image: ghcr.io/supersonicteam/backend:${BACKEND_TAG:-latest}
    logging: *logging
    restart: unless-stopped
    # Janela do graceful shutdown do Spring (30s, #101) + folga.
    stop_grace_period: 35s
    environment:
      SPRING_PROFILES_ACTIVE: homolog
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agrocontabil}
      DB_NAME: ${DB_NAME:-agrocontabil}
      DB_USER: ${DB_USER:-agrocontabil}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: https://${SITE_HOST}
      # Atras do Caddy (HTTPS): o cookie de refresh pode e deve ser Secure.
      REFRESH_COOKIE_SEGURO: 'true'
      REDEFINICAO_URL_FRONTEND: https://${SITE_HOST}/redefinir-senha
      # Links dos convites (#460): o da carteira abre /escritorio, onde o produtor ve os convites.
      CARTEIRA_CONVITE_URL_FRONTEND: https://${SITE_HOST}/escritorio
      ESCRITORIO_CONVITE_URL_FRONTEND: https://${SITE_HOST}/equipe/convite
      # Endereco proprio do escritorio, {slug}.SITE_DOMINIO (#464): o dominio base dos subdominios e a
      # chave do "ask" do Caddy (GET /interno/tls/permitido, so na rede interna). Passo a passo no
      # deploy/README.md, secao Endereco proprio do escritorio.
      APP_ESCRITORIO_DOMINIO_BASE: ${SITE_DOMINIO:?defina SITE_DOMINIO no .env (deploy/README.md, Endereco proprio do escritorio)}
      APP_ESCRITORIO_TLS_ASK_CHAVE: ${TLS_ASK_CHAVE:?defina TLS_ASK_CHAVE no .env (deploy/README.md, Endereco proprio do escritorio)}
      # E-mail (#460). DESLIGADO ate o passo a passo do README; credenciais so no .env. Com SMTP, host,
      # usuario ou senha vazios, remetente fora do dominio verificado ou link http impedem a subida.
      EMAIL_MODO: ${EMAIL_MODO:-DESLIGADO}
      EMAIL_REMETENTE: '${EMAIL_REMETENTE:-AgroConIA <nao-responda@agroconia.com.br>}'
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-true}
      EMAIL_SMTP_SSL: ${EMAIL_SMTP_SSL:-false}
      # Teto de envios abaixo da cota do provedor (#460): Resend Free 0/80. Nunca 0 no diario.
      EMAIL_TETO_POR_HORA: ${EMAIL_TETO_POR_HORA:-0}
      EMAIL_TETO_POR_DIA: ${EMAIL_TETO_POR_DIA:-80}
      # Ja vem desligado na imagem da #460; repetido aqui para a imagem anterior nao cair em DOWN com
      # o SPRING_MAIL_HOST vazio, se este compose chegar antes dela.
      MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
      # Aceite dos termos no cadastro (#519): ligue o exigir quando a tela nova mandar o campo;
      # mude a versao quando o texto dos termos mudar (#498).
      CADASTRO_EXIGIR_ACEITE_TERMOS: ${CADASTRO_EXIGIR_ACEITE_TERMOS:-false}
      TERMOS_VERSAO: ${TERMOS_VERSAO:-2026-11-11}
      SEED_SENHA: ${SEED_SENHA:-}
      # Escritorio, carteira e notas da banca (#315), com as contas na SEED_SENHA. Idempotente.
      DEMONSTRACAO_HABILITADA: 'true'
      # Fora de dev a aplicacao recusa segredo ausente, placeholder ou publicado (#222) e a chave de
      # cifra publica de desenvolvimento (#147). Trocar a CRIPTO_CHAVE torna ilegiveis os dados
      # pessoais ja gravados: nunca troque sem zerar o banco ou recifrar.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CRIPTO_CHAVE: ${CRIPTO_CHAVE:?defina CRIPTO_CHAVE no .env}
      # Certificado autoassinado de teste (publico); a SEFAZ segue o mock. A senha e o alias sao os
      # do certificado de teste, que fora de dev nao tem valor padrao.
      NFE_CERT_PATH: file:/certs/nfe-teste.p12
      NFE_CERT_PASSWORD: changeit
      NFE_CERT_ALIAS: nfe-teste
      # Sem SEFAZ real, a NF-e de terceiro importada na demonstracao nunca seria confirmada: o mock
      # da a chave desconhecida como autorizada (#223; padrao so no application-dev.yml).
      APP_NFE_SEFAZ_MOCK_AUTORIZAR_TERCEIROS: 'true'
      AI_OLLAMA_BASE_URL: http://ollama:11434
      # ollama (padrao) ou anthropic (Claude pela API; sem ANTHROPIC_API_KEY o backend nao sobe).
      # "openai" nao e suportado aqui: este compose nao repassa AI_API_KEY nem a URL.
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      # AI_CHAT_MODEL e so o modelo do Ollama; o da Anthropic e AI_ANTHROPIC_MODEL.
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b-instruct}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ANTHROPIC_MODEL: ${AI_ANTHROPIC_MODEL:-claude-haiku-5-5}
      # Sem os dois-pontos: vazio no .env chega vazio (= nao enviar o campo de raciocinio).
      AI_ANTHROPIC_THINKING: ${AI_ANTHROPIC_THINKING-disabled}
      # Explicacao depois da resposta de dados (#268), desligada por padrao: ligar so com a medicao
      # do modelo real e o OK do Murillo (docs/avaliacao/explicacao/README.md).
      AI_EXPLICACAO_HABILITADA: ${AI_EXPLICACAO_HABILITADA:-false}
      AI_EXPLICACAO_TIMEOUT: ${AI_EXPLICACAO_TIMEOUT:-8s}
      # Janela de contexto, teto geral e tetos por tipo de chamada (#270); padroes = os do yml.
      AI_OLLAMA_NUM_CTX: ${AI_OLLAMA_NUM_CTX:-8192}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      AI_TETO_FUNCOES: ${AI_TETO_FUNCOES:-512}
      AI_TETO_EXPLICACAO: ${AI_TETO_EXPLICACAO:-256}
      AI_TETO_CLASSIFICACAO: ${AI_TETO_CLASSIFICACAO:-256}
      AI_TETO_LEGISLACAO: ${AI_TETO_LEGISLACAO:-1024}
      # Fidelidade da rota de lei (#269), tudo desligado por padrao (= o do application.yml): copiar este
      # compose nao liga nada. Ligar e so no .env, com os valores de deploy/README.md ("Fidelidade da
      # rota de lei"); booleanos em minusculas.
      AI_FIDELIDADE_LEI_HABILITADA: ${AI_FIDELIDADE_LEI_HABILITADA:-false}
      AI_FIDELIDADE_LEI_COBERTURA_MINIMA: ${AI_FIDELIDADE_LEI_COBERTURA_MINIMA:-0.7}
      AI_FIDELIDADE_LEI_COBERTURA_MINIMA_COM_JUIZ: ${AI_FIDELIDADE_LEI_COBERTURA_MINIMA_COM_JUIZ:-0.3}
      AI_FIDELIDADE_LEI_JUIZ_HABILITADO: ${AI_FIDELIDADE_LEI_JUIZ_HABILITADO:-false}
      AI_FIDELIDADE_LEI_JUIZ_CONFIGURACAO: ${AI_FIDELIDADE_LEI_JUIZ_CONFIGURACAO:-atual}
      AI_FIDELIDADE_LEI_JUIZ_VETO_HABILITADO: ${AI_FIDELIDADE_LEI_JUIZ_VETO_HABILITADO:-true}
      AI_FIDELIDADE_LEI_JUIZ_RESGATE_HABILITADO: ${AI_FIDELIDADE_LEI_JUIZ_RESGATE_HABILITADO:-false}
      AI_FIDELIDADE_LEI_JUIZ_RESGATE_POLARIDADE: ${AI_FIDELIDADE_LEI_JUIZ_RESGATE_POLARIDADE:-false}
      AI_FIDELIDADE_LEI_JUIZ_RESGATE_COBERTURA: ${AI_FIDELIDADE_LEI_JUIZ_RESGATE_COBERTURA:-false}
      AI_TETO_JUIZ: ${AI_TETO_JUIZ:-128}
      AI_TETO_JUIZ_JUSTIFICATIVA: ${AI_TETO_JUIZ_JUSTIFICATIVA:-1024}
      ANTIVIRUS_MODO: CLAMAV
      ANTIVIRUS_HOST: clamav
      # Atras do Caddy: sem isto o backend ve todo cliente com o IP do Caddy e o limite por IP de
      # login/cadastro (#208) vira um limite global — 10 senhas erradas de um usuario barram o login de
      # todos por 1 min. O Tomcat so confia no X-Forwarded-For de proxy interno (172.16/12 inclui a
      # rede do compose) e o Caddy reescreve o header com o IP real (nao repassa o do cliente).
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=25 -Duser.timezone=America/Sao_Paulo
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
      SPRING_JPA_SHOW_SQL: 'false'
    volumes:
      - ./certs:/certs:ro
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    image: ghcr.io/supersonicteam/frontend:${FRONTEND_TAG:-latest}
    logging: *logging
    restart: unless-stopped
    networks: [interna]
    # O deploy.sh espera este healthy antes de dar o deploy por concluido (senao, rollback).
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend

  # Unica porta publica. HTTPS automatico (Let's Encrypt) no SITE_HOST e, sob demanda, nos enderecos
  # dos escritorios ({slug}.SITE_DOMINIO, #464), so com o "ask" do backend autorizando.
  caddy:
    image: caddy:2.10-alpine
    logging: *logging
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_HOST: ${SITE_HOST:?defina SITE_HOST no .env}
      SITE_REDIRECIONA: ${SITE_REDIRECIONA:?defina SITE_REDIRECIONA no .env}
      SITE_DOMINIO: ${SITE_DOMINIO:?defina SITE_DOMINIO no .env (deploy/README.md, Endereco proprio do escritorio)}
      TLS_ASK_CHAVE: ${TLS_ASK_CHAVE:?defina TLS_ASK_CHAVE no .env (deploy/README.md, Endereco proprio do escritorio)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Quadros da jornada 3D da landing (frontend#174), servidos em /jornada/* pelo Caddyfile. Crie a
      # pasta antes do up: se faltar, o Docker a cria vazia e do root (deploy/README.md, Jornada da landing).
      - ./jornada:/srv/jornada:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [interna]
    depends_on:
      - frontend
      - backend
