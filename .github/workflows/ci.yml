name: CI - Backend

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw verify --batch-mode --no-transfer-progress

      # Gerador do relatorio do benchmark da Ceres (#348): so biblioteca padrao do Python.
      - name: Benchmark da Ceres (testes do gerador)
        run: python3 -m unittest discover -s docs/avaliacao/benchmark/tests -t docs/avaliacao/benchmark

      # Medicao do periodo relativo da Ceres (#452): executor e pontuacao, so biblioteca padrao.
      - name: Medicao da #452 (testes do executor e da pontuacao)
        run: python3 -m unittest discover -s docs/avaliacao/ceres-452 -p "test_*.py"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7