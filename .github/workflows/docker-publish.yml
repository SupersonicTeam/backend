name: Docker - Backend (GHCR + deploy)

# CD do backend: depois do "CI - Backend" de um push na main, publica a imagem no GHCR (amd64 + arm64,
# VPS Oracle Ampere) e faz o deploy na VPS pelo deploy.sh (deploy/README.md): lock da VPS
# compartilhado com o frontend, so o servico backend e recriado, rollback para a tag anterior se nao
# ficar healthy.
#
# Cada execucao e so um "aviso" (#621): o commit publicado NAO e o que disparou a execucao, e sim o
# mais novo da main (primeiro pai) com a CI verde, resolvido quando a execucao comeca. As execucoes
# rodam uma por vez, sem cancelar a que esta rodando; a pendente que for cancelada por outra mais
# nova nao faz falta, porque a mais nova comeca depois e ve tudo o que ela veria. Assim a VPS termina
# no commit verde mais novo qualquer que seja a ordem de termino das CIs, e um commit antigo nunca
# publica por cima de um novo. Prova por casos no PR do #621 e no deploy/README.md (CI/CD).
#
# workflow_dispatch e reexecucao: reimplantam a ponta verde da main (ex.: VPS recriada), nunca um
# commit escolhido. Versao especifica: deploy.sh na VM (deploy/README.md).
on:
  workflow_run:
    workflows: ['CI - Backend']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read # ler as execucoes da CI para achar o commit verde mais novo

jobs:
  deploy:
    name: Build, push e deploy na VPS
    # Sem "if" de proposito: ate a CI que falhou dispara a execucao, que reimplanta a ponta verde
    # (com a mesma tag o deploy.sh nao recria o container). Assim nenhum job pulado ocupa a fila no
    # lugar de um aviso necessario. Um PR de fork vindo de uma branch "main" tambem dispara: so
    # reimplanta a ponta verde da main, sem rodar codigo do PR.
    runs-on: ubuntu-latest
    # Uma execucao por vez, sem cancelar a que esta rodando (a pendente pode ser trocada pela mais
    # nova, que cobre o que ela faria).
    concurrency:
      group: deploy-vps-backend
      cancel-in-progress: false
    environment:
      name: vps-oracle
      url: https://${{ vars.VPS_SITE_HOST }}

    steps:
      # Ponta atual da main (nao o github.sha do evento, que fica parado no momento do disparo).
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100

      # Commit a publicar: o primeiro da main (primeiro pai, do mais novo para o mais antigo) com uma
      # execucao de push do "CI - Backend" verde em qualquer tentativa (uma reexecucao em andamento
      # ou que falhe depois nao tira o commit do conjunto, senao a VPS poderia voltar para um commit
      # anterior; por isso a lista nao filtra por status=completed).
      - name: Commit verde mais novo da main
        id: alvo
        env:
          GH_TOKEN: ${{ github.token }}
          DISPARO_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DISPARO_CONCLUSAO: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f per_page=100 \
            --jq '.workflow_runs[] | "\(.head_sha) \(.conclusion) \(.id) \(.run_attempt)"' > "$RUNNER_TEMP/ci.txt"
          while read -r sha conclusao id tentativas; do
            if [ "$conclusao" = success ]; then echo "$sha"; continue; fi
            for ((a = 1; a < tentativas; a++)); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/$a" --jq .conclusion < /dev/null)" = success ]; then
                echo "$sha"; break
              fi
            done
          done < "$RUNNER_TEMP/ci.txt" > "$RUNNER_TEMP/verdes.txt"
          alvo=$(git rev-list --first-parent --max-count=100 HEAD | grep -Fx -m1 -f "$RUNNER_TEMP/verdes.txt" || true)
          {
            echo "### Deploy do backend"
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo "- Disparo: CI de \`${DISPARO_SHA::7}\` terminou com \`$DISPARO_CONCLUSAO\`"
            else
              echo "- Disparo: $GITHUB_EVENT_NAME (reimplanta a ponta verde da main)"
            fi
            echo "- Ponta da main agora: \`$(git rev-parse --short=7 HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$alvo" ]; then
            echo "- **Nada publicado:** nenhum dos 100 ultimos commits da main tem a CI verde." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Nenhum dos 100 ultimos commits da main tem o CI - Backend verde; nada publicado."
            exit 1
          fi
          git checkout -q --detach "$alvo"
          echo "- Alvo (commit verde mais novo da main): \`${alvo::7}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$alvo" != "$DISPARO_SHA" ]; then
            echo "- O alvo nao e o commit do disparo (CI dele nao verde, ou ja ha commit verde mais novo): vai a ponta verde." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "sha=$alvo"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=sha-${alvo::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Imagem do alvo ja publicada (aviso repetido, reexecucao): so move o latest, sem novo build. Um
      # build novo da mesma tag mudaria o digest e recriaria o container na VPS sem motivo.
      - name: Imagem ja publicada?
        id: existe
        env:
          IMAGEM: ${{ steps.alvo.outputs.image }}:${{ steps.alvo.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGEM" > /dev/null 2> "$RUNNER_TEMP/inspect.err"; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "- Imagem \`$IMAGEM\` ja estava no GHCR: sem novo build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
            echo "Imagem nao encontrada (ou GHCR sem resposta), segue o build: $(head -c 300 "$RUNNER_TEMP/inspect.err")"
          fi

      # Só o estágio final (apk add, adduser) roda emulado em arm64; o Maven roda nativo
      # (FROM --platform=$BUILDPLATFORM no Dockerfile).
      - name: Set up QEMU
        if: steps.existe.outputs.sim == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.existe.outputs.sim == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existe.outputs.sim == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.alvo.outputs.image }}:${{ steps.alvo.outputs.tag }}
            ${{ steps.alvo.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.alvo.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mover o latest
        if: steps.existe.outputs.sim == 'true'
        env:
          IMAGEM: ${{ steps.alvo.outputs.image }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: docker buildx imagetools create -t "$IMAGEM:latest" "$IMAGEM:$TAG"

      # A chave so executa "deploy <servico> <tag>" (command= forcado no authorized_keys da VPS).
      - name: Deploy
        id: deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -o pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "ubuntu@$HOST" "deploy backend $TAG" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # Conferencia: o deploy.sh so escreve "ok: backend em <tag>" depois de gravar a tag no .env,
      # recriar o servico e ve-lo healthy; a linha "<antes> -> <tag>" diz o que estava no ar. A chave da
      # CI nao tem outro comando na VPS, entao a conferencia e pelo relatorio do proprio deploy.sh.
      - name: Conferir a imagem no ar
        if: always() && steps.alvo.outcome == 'success'
        env:
          TAG: ${{ steps.alvo.outputs.tag }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY" != success ] && [ "$DEPLOY" != failure ]; then
            echo "- **Falhou antes do deploy** (build, push ou login): a VPS nao foi tocada. Veja os passos anteriores." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::O deploy nao rodou: falha antes dele (build, push ou login). A VPS nao foi tocada."
            exit 1
          fi
          log="$RUNNER_TEMP/deploy.log"
          antes=$(grep -oE "\] [^ ]+ -> ${TAG}\$" "$log" 2>/dev/null | head -n1 | sed -E 's/^\] ([^ ]+) -> .*/\1/' || true)
          if grep -qE "\] ok: backend em ${TAG}\$" "$log" 2>/dev/null; then
            echo "- **Publicado:** backend em \`$TAG\` na VPS (antes: \`${antes:-desconhecido}\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- **Falhou:** a VPS nao confirmou o backend em \`$TAG\` (antes: \`${antes:-desconhecido}\`). Veja o passo Deploy: rollback ou lock ocupado." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::A VPS nao confirmou o backend em $TAG (o deploy.sh nao escreveu 'ok: backend em $TAG'). Confira o passo Deploy."
          exit 1
