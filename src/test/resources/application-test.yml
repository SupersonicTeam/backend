# Profile TEST — banco H2 em memoria, sem Docker, para os testes de contexto.
spring:
  datasource:
    url: jdbc:h2:mem:agrocontabil;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      # Hibernate cria o schema a partir das entidades — Liquibase desabilitado no perfil test
      # porque usa SQL PostgreSQL-especifico (gen_random_uuid(), text[], jsonb etc.)
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  # Ceres (issue #141): a CI nao depende do Ollama. Os modelos reais ficam desligados e
  # ModelosSimuladosConfig (src/test) registra ChatModel/EmbeddingModel simulados.
  ai:
    model:
      chat: none
      embedding: none

app:
  # O schema H2 nasce depois do contexto (script @Sql): o teste do preenchimento o chama direto.
  notas:
    busca:
      preencher-legado: false
    tributos:
      recalcular-legado: false
  cors:
    allowed-origins: http://localhost:4200
  # BCrypt no custo minimo: o custo de producao (12) somaria segundos a cada teste de cadastro.
  seguranca:
    senha:
      bcrypt-custo: 4
    # Segredo fixo de teste (so existe aqui; >= 32 bytes, como o JwtService exige).
    cripto:
      permitir-chave-de-desenvolvimento: true
      # O schema H2 nasce depois do contexto (script @Sql): o teste da migracao a chama direto.
      migrar-legado: false
    jwt:
      segredo: segredo-de-teste-agrocontabil-com-mais-de-32-bytes
      # Este segredo e publico: fora do modo de dev/test o JwtService o recusa (#222).
      permitir-segredo-efemero: true
    # Limites por IP altos: todas as requisicoes do MockMvc vem de 127.0.0.1, e as suites de
    # login fazem dezenas. O teste do limite os baixa com @TestPropertySource.
    forca-bruta:
      login-por-minuto: 100000
      cadastro-por-minuto: 100000
      refresh-por-minuto: 100000
      senha-por-minuto: 100000
    limite:
      geral-por-minuto: 100000
      chat-por-minuto: 100000
    # Limpeza das sessoes desligada: os testes chamam o job direto.
    refresh:
      limpeza:
        enabled: false
  nfe:
    # Certificado autoassinado de teste (sem valor juridico) — ver src/test/resources/certs/README.md
    certificado:
      path: classpath:certs/nfe-teste.p12
      password: changeit
      alias: nfe-teste
    # SEFAZ: job de sincronizacao desativado nos testes (nao interferir nas assercoes).
    sefaz:
      sync:
        enabled: false
  # Apuracao: job de fechamento automatico desativado nos testes (nao interferir nas assercoes).
  apuracao:
    fechamento:
      enabled: false
  # Guias fiscais: job de sincronizacao de vencidas desativado nos testes (mesmo motivo).
  guia-fiscal:
    sync:
      enabled: false
  # Retencao da auditoria (#149): job desativado; o teste dele o instancia.
  auditoria:
    retencao:
      enabled: false
  # Alertas tributarios (#140): job desativado; os testes chamam o service direto.
  alertas:
    enabled: false
  # Antivirus dos anexos (#227): sem ClamAV nos testes; os do antivirus trocam a porta por
  # @MockitoBean e chamam o reprocessamento direto.
  # Notificacao (#182): jobs desligados; os testes chamam o service e o job direto.
  notificacao:
    aviso:
      enabled: false
    retencao:
      enabled: false
  pendencias:
    antivirus:
      modo: SEM_VERIFICACAO
      reverificacao:
        enabled: false
  # Cota semanal da Ceres (#166): desligada nos testes da Ceres em geral (dezenas de perguntas por
  # produtor); os testes da cota a ligam com @TestPropertySource.
  assistente:
    # Os testes de rota programam o classificador (ChatModelSimulado.classificarComo); as camadas
    # da #265 tem testes proprios, que as ligam.
    classificacao:
      camadas: false
    cota:
      habilitada: false
