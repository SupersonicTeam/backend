# ArchUnit (issue #141). Linha de base das FreezingArchRule do ArquiteturaCamadasTest: violacoes
# preexistentes ficam registradas aqui e nao quebram o build; violacoes novas quebram.
freeze.store.default.path=src/test/resources/archunit_store
# false: a linha de base ja existe. Com true, mudar a descricao de uma regra criaria em silencio uma
# linha de base nova aceitando as violacoes do momento. Regra nova: ligar so para criar o registro.
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
