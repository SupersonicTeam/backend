# Profile PROD — tudo via variavel de ambiente. Nenhum segredo no repositorio.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Tamanho e timeouts do pool vem do application.yml base (issue #98).
      # Aqui fica apenas o que e especifico do PostgreSQL: o statement_timeout do servidor,
      # que aborta a query presa no banco — o driver H2 dos testes rejeitaria esta propriedade.
      data-source-properties:
        options: -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}

  docker:
    compose:
      # Em producao o banco e gerenciado externamente, nao pelo Boot.
      enabled: false

  jpa:
    show-sql: false

# CORS restrito as origens reais de producao (env obrigatoria).
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  # Recuperacao de senha (#209) e convites (#460): em prod o envio e por SMTP e os tres links
  # precisam ser HTTPS (a aplicacao nao sobe com http:// nem sem a variavel).
  seguranca:
    redefinicao:
      url-frontend: ${REDEFINICAO_URL_FRONTEND}
      modo-email: ${EMAIL_MODO:SMTP}
  carteira:
    convite:
      url-frontend: ${CARTEIRA_CONVITE_URL_FRONTEND}
  escritorio:
    convite:
      url-frontend: ${ESCRITORIO_CONVITE_URL_FRONTEND}

# Em prod nao expomos detalhes de health sem autorizacao.
management:
  endpoint:
    health:
      show-details: never

# Documentacao fechada em producao (issue #93). O SecurityConfig lista /v3/api-docs e /swagger-ui
# como rotas publicas — o que e desejavel em dev e homolog, e indesejavel aqui: publicar o contrato
# completo da API expoe a superficie de ataque (OWASP API9, inventario impróprio) sem nenhum ganho,
# porque o consumidor de producao e o proprio frontend, que ja conhece o contrato.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    br.com.agrocontabil: INFO

# Atras do Nginx (#208): o limite de tentativas por IP precisa do IP do cliente, nao do proxy.
# "native" liga o RemoteIpValve do Tomcat, que so aceita X-Forwarded-For quando quem conecta e um
# proxy interno (127.x, 10.x, 172.16-31.x, 192.168.x) — um cliente da internet nao forja o IP.
# Fixe o endereco real do Nginx em SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (ver .env.example) e
# nunca publique a porta do backend fora da rede interna.
server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
