# Profile PROD — tudo via variavel de ambiente. Nenhum segredo no repositorio.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Tamanho e timeouts do pool vem do application.yml base (issue #98).
      # Aqui fica apenas o que e especifico do PostgreSQL: o statement_timeout do servidor,
      # que aborta a query presa no banco — o driver H2 dos testes rejeitaria esta propriedade.
      data-source-properties:
        options: -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}

  docker:
    compose:
      # Em producao o banco e gerenciado externamente, nao pelo Boot.
      enabled: false

  jpa:
    show-sql: false

# CORS restrito as origens reais de producao (env obrigatoria).
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  # Segredo do JWT injetado por env — usado a partir da Sprint 8 (auth).
  security:
    jwt-secret: ${JWT_SECRET:}

# Em prod nao expomos detalhes de health sem autorizacao.
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    br.com.agrocontabil: INFO
