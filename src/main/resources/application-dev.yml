# Profile DEV — desenvolvimento local com Postgres via Docker Compose.
# O spring-boot-docker-compose sobe o compose.yaml automaticamente ao iniciar.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:agrocontabil}
    username: ${DB_USER:agrocontabil}
    password: ${DB_PASSWORD:agrocontabil}

  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logs verbosos em dev para facilitar o desenvolvimento.
logging:
  level:
    br.com.agrocontabil: DEBUG
    org.hibernate.SQL: DEBUG

app:
  nfe:
    # Certificado autoassinado de teste (src/test/resources/certs) — apenas para permitir
    # assinar/autorizar NF-e em dev local (SEFAZ ja e mock). NUNCA usar em prod.
    #
    # O path default abaixo e relativo ao working directory do processo e so resolve
    # rodando a partir da raiz do checkout (./mvnw spring-boot:run) — se o backend for
    # iniciado de outro diretorio ou via JAR empacotado (target/*.jar fora do checkout),
    # o arquivo nao sera encontrado e a assinatura falhara com "Arquivo de certificado
    # nao encontrado". Nesses casos, sobrescreva com um caminho absoluto via
    # NFE_CERT_PATH=file:/caminho/absoluto/para/nfe-teste.p12.
    certificado:
      path: ${NFE_CERT_PATH:file:src/test/resources/certs/nfe-teste.p12}
      password: ${NFE_CERT_PASSWORD:changeit}
      alias: ${NFE_CERT_ALIAS:nfe-teste}
