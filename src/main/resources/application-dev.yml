# Profile DEV — desenvolvimento local com Postgres via Docker Compose.
# O spring-boot-docker-compose sobe o compose.yaml automaticamente ao iniciar.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:agrocontabil}
    username: ${DB_USER:agrocontabil}
    # Sem default (#225): a senha vem do .env, o mesmo que o compose.yaml usa para criar o banco.
    # Uma senha literal aqui virava a senha efetiva de qualquer servidor que subisse com dev.
    password: ${DB_PASSWORD}
    hikari:
      # statement_timeout do PostgreSQL (issue #98): aborta no servidor a query que passar do
      # limite, complementando o timeout de transacao do Spring. Fica fora do application.yml
      # base porque o driver H2 usado nos testes rejeita propriedades JDBC desconhecidas.
      data-source-properties:
        options: -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}

  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logs verbosos em dev para facilitar o desenvolvimento.
logging:
  level:
    br.com.agrocontabil: DEBUG
    org.hibernate.SQL: DEBUG

app:
  # Sem JWT_SECRET em dev, um segredo aleatorio e gerado na subida (tokens morrem no reinicio, #206).
  seguranca:
    # Sem CRIPTO_CHAVE, a chave publica de desenvolvimento (#147): dado de dev nao e protegido.
    cripto:
      permitir-chave-de-desenvolvimento: true
    jwt:
      permitir-segredo-efemero: true
    # Dev roda em http://localhost: um cookie Secure nao seria gravado pelo navegador.
    refresh:
      cookie-seguro: ${REFRESH_COOKIE_SEGURO:false}
    # Dev sem SMTP: o link de redefinicao de senha vai para o log (#209).
    redefinicao:
      modo-email: ${EMAIL_MODO:LOG}
  # Dev sem o container do ClamAV: anexo sai limpo sem verificar (#227). Com
  # `docker compose --profile antivirus up -d clamav`, use ANTIVIRUS_MODO=CLAMAV.
  pendencias:
    antivirus:
      modo: ${ANTIVIRUS_MODO:SEM_VERIFICACAO}
  # Senha das contas semeadas (#206). Vazia = seed sem credencial; precisa passar na politica.
  seed:
    senha: ${SEED_SENHA:}
  nfe:
    # Certificado autoassinado de teste (src/test/resources/certs) — apenas para permitir
    # assinar/autorizar NF-e em dev local (SEFAZ ja e mock). NUNCA usar em prod: a chave privada e
    # a senha sao publicas. E default so deste profile, e a subida avisa em WARN quando o
    # certificado carregado e autoassinado (#225).
    #
    # O path default abaixo e relativo ao working directory do processo e so resolve
    # rodando a partir da raiz do checkout (./mvnw spring-boot:run) — se o backend for
    # iniciado de outro diretorio ou via JAR empacotado (target/*.jar fora do checkout),
    # o arquivo nao sera encontrado e a assinatura falhara com "Arquivo de certificado
    # nao encontrado". Nesses casos, sobrescreva com um caminho absoluto via
    # NFE_CERT_PATH=file:/caminho/absoluto/para/nfe-teste.p12.
    certificado:
      path: ${NFE_CERT_PATH:file:src/test/resources/certs/nfe-teste.p12}
      password: ${NFE_CERT_PASSWORD:changeit}
      alias: ${NFE_CERT_ALIAS:nfe-teste}
