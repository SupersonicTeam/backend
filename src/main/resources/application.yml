# Configuracao base — compartilhada por todos os profiles.
# Profile ativo definido por SPRING_PROFILES_ACTIVE (default: dev).
spring:
  application:
    name: agrocontabil-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  # Pool de conexoes JDBC (issue #98). Todos os valores sao parametrizaveis por env — ver
  # .env.example. Nenhuma propriedade especifica do PostgreSQL entra aqui: o driver H2 usado nos
  # testes rejeita propriedades JDBC desconhecidas. O statement_timeout vive em
  # application-dev.yml / application-prod.yml.
  datasource:
    hikari:
      pool-name: agrocontabil-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Quanto uma thread espera por uma conexao livre antes de falhar rapido, em vez de
      # enfileirar requisicoes indefinidamente.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}          # 10 min
      # Aposenta a conexao antes de qualquer timeout de infraestrutura (firewall/pgbouncer).
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}         # 30 min
      # Loga (WARN, com stack trace) a conexao que ficou fora do pool tempo demais — e o que
      # torna visivel um vazamento de conexao. Precisa ser MENOR que max-lifetime, senao o
      # Hikari desativa a deteccao. Valores abaixo de 2000 ms sao ignorados.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:30000}   # 30 s
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}

  # Teto para qualquer transacao sem timeout explicito: impede que uma transacao presa segure
  # uma conexao do pool indefinidamente. Generoso o bastante para importacao de lote de XML,
  # geracao de DANFE e fechamento mensal.
  transaction:
    default-timeout: ${DB_TX_TIMEOUT:30s}

  # Agendamento dos jobs (issue #101). Sem estas propriedades o Boot cria um scheduler de UMA
  # thread e os tres jobs (SefazStatusSyncJob, ApuracaoFechamentoJob, GuiaFiscalStatusSyncJob)
  # disputam entre si — um job lento atrasa os demais.
  # Concorrencia entre INSTANCIAS (lock distribuido) e a issue #87, nao esta coberta aqui.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:3}          # uma thread por job; 1 volta ao comportamento serializado
      thread-name-prefix: agro-sched-
      shutdown:
        # Espera o job em andamento terminar antes de encerrar. Desde a issue #100 o fechamento
        # mensal commita produtor a produtor e para entre dois produtores ao ser interrompido: os
        # ja fechados ficam FECHADOS e os restantes ABERTOS para o proximo disparo.
        await-termination: true
        await-termination-period: ${SCHEDULER_SHUTDOWN_TIMEOUT:30s}

  # Janela para cada fase do encerramento concluir (requisicoes em voo, jobs, pool).
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  # Upload de XML para importacao de notas (issue #19). Limites conservadores: um XML de
  # NF-e assinado costuma ter dezenas de KB; permitimos lotes de varios arquivos.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 20MB

  jpa:
    open-in-view: false
    hibernate:
      # Schema e versionado pelo Liquibase — Hibernate nunca altera DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        # Batch fetching: transforma o N+1 de colecoes/proxies LAZY (ex.: os itens e o produtor
        # de cada nota na listagem paginada de /api/notas) em poucas queries com IN(...),
        # em vez de 1 query por nota. Mitiga o N+1 sem quebrar a paginacao (ao contrario de
        # JOIN FETCH com Pageable, que pagina em memoria — HHH000104).
        default_batch_fetch_size: 25

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Timeouts dos clientes HTTP criados pelo Boot (issue #141). Hoje os unicos consumidores sao os
  # clientes do Spring AI (Ollama / API compativel com a da OpenAI): o projeto nao tinha nenhum
  # RestClient/WebClient antes. O read-timeout e generoso porque um modelo local em CPU pode levar
  # dezenas de segundos para responder; o connect-timeout e curto para falhar rapido com o Ollama
  # fora do ar.
  http:
    client:
      connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_READ_TIMEOUT:120s}
    reactiveclient:
      connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_READ_TIMEOUT:120s}

  # Ceres — assistente fiscal (issue #141). Arquitetura: Tool Calling + RAG + orquestracao.
  ai:
    model:
      # Provedor do modelo de chat: "ollama" (local, padrao) ou "openai" (qualquer API compativel
      # com a da OpenAI: OpenAI, Maritaca...). Trocar e so configuracao, nenhum codigo muda.
      chat: ${AI_CHAT_PROVIDER:ollama}
      # Embedding e SEMPRE local (bge-m3, 1024 dimensoes). Nao e env var de proposito: trocar o
      # modelo de embedding obriga a reindexar toda a legislacao (issue #156).
      embedding: ollama
      # O starter da OpenAI tambem autoconfigura imagem, audio e moderacao, cada um exigindo chave
      # de API na subida. Desligados: a Ceres so usa chat.
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      # Os modelos sao baixados pelo servico ollama-init do compose. Puxar na subida do backend
      # (when_missing) bloquearia a aplicacao por minutos na primeira vez e a impediria de subir
      # com o Ollama fora do ar — e o resto do sistema nao depende do modelo.
      init:
        pull-model-strategy: ${AI_OLLAMA_PULL_STRATEGY:never}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3:4b}
          # Temperatura baixa: a Ceres redige a partir de dados e trechos de lei, nao cria.
          temperature: 0.2
          # Janela de contexto explicita. Estourada, o Ollama descarta o INICIO do prompt — onde
          # fica a instrucao de sistema com as regras da Ceres. O qwen3 suporta 32k.
          num-ctx: ${AI_OLLAMA_NUM_CTX:8192}
          # Teto de tokens gerados por chamada: limita latencia e custo de uma pergunta.
          num-predict: ${AI_MAX_TOKENS:1024}
          # O qwen3 raciocina por padrao; os tokens de raciocinio consomem o num-predict (resposta
          # cortada) e multiplicam a latencia em CPU. Os numeros da Ceres vem das funcoes, nao do
          # raciocinio do modelo. Vazio = nao enviar (modelo sem suporte). Ver ThinkOptionConverter.
          think-option: ${AI_OLLAMA_THINK:false}
      embedding:
        options:
          model: bge-m3
    openai:
      # Chave SOMENTE por variavel de ambiente — nunca no repositorio.
      api-key: ${AI_API_KEY:}
      base-url: ${AI_API_BASE_URL:https://api.openai.com}
      chat:
        # Provedores compativeis nem sempre usam o prefixo /v1 da OpenAI (ex.: a Maritaca expoe
        # <base>/chat/completions).
        completions-path: ${AI_API_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
          max-tokens: ${AI_MAX_TOKENS:1024}
    # Retry curto: a pergunta do usuario esta esperando. Erro 4xx (chave invalida, requisicao
    # malformada) nao melhora repetindo.
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      on-client-errors: false
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    # Nunca registrar prompt, resposta ou conteudo de ferramenta em log/observacao: carregam dados
    # do produtor (issue #144). Os padroes ja sao false; explicitos para nao depender deles.
    chat:
      observations:
        log-prompt: false
        log-completion: false
    tools:
      observations:
        include-content: false

# Ao receber SIGTERM o Tomcat para de aceitar conexoes novas e espera as requisicoes ativas
# terminarem, em vez de corta-las no meio (issue #101). O compose usa stop_grace_period: 35s
# para nao matar o processo antes desta janela.
# ATENCAO (issue #125): este bloco fica DEPOIS de todo o spring:. Inserido no meio dele, na
# coluna 0, ele prende as chaves seguintes (jpa, servlet, liquibase) como server.* — que o Spring
# ignora em silencio. ApplicationYamlEstruturaTest trava isso.
server:
  shutdown: graceful

# Documentacao OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator — somente health/info expostos por padrao; metricas vem na fase pos-basico.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # DEGRADED (issue #141): o Ollama fora do ar ou sem o modelo nao derruba o health. O resto do
      # sistema funciona sem a Ceres; DOWN faria o healthcheck do compose reiniciar um backend
      # saudavel. Status fora do http-mapping respondem 200.
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN

# Configuracoes da aplicacao (namespace proprio)
app:
  cors:
    # Lista separada por virgula; sobrescrita por APP_CORS_ALLOWED_ORIGINS em prod.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  nfe:
    # Certificado digital A1 (.p12) para assinatura da NF-e. Em prod vem de env var.
    # Nenhum segredo no repositorio — ver .env.example.
    certificado:
      path: ${NFE_CERT_PATH:}
      password: ${NFE_CERT_PASSWORD:}
      alias: ${NFE_CERT_ALIAS:}
    # Integracao SEFAZ (issue #15). Sprint 3 usa transporte mock (sandbox).
    # O envio SOAP+mTLS real com certificado ICP-Brasil e debito da Sprint 7:
    # basta definir mock.enabled=false e plugar a implementacao real de SefazTransport.
    sefaz:
      ambiente: ${NFE_SEFAZ_AMBIENTE:HOMOLOGACAO}   # HOMOLOGACAO | PRODUCAO
      mock:
        enabled: ${NFE_SEFAZ_MOCK_ENABLED:true}
      # Retry (issue #83): envio e cancelamento so re-tentam falha de CONEXAO (nada saiu); a
      # consulta de status, que e leitura, re-tenta qualquer falha de comunicacao.
      retry:
        max-attempts: ${NFE_SEFAZ_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${NFE_SEFAZ_RETRY_BACKOFF_MS:1000}
      # Timeouts de rede do transporte real (issue #83). O mock os ignora. Conexao e leitura
      # separados: e o que permite ao transporte dizer se a requisicao saiu ou nao.
      timeout:
        connect-ms: ${NFE_SEFAZ_CONNECT_TIMEOUT_MS:10000}
        read-ms: ${NFE_SEFAZ_READ_TIMEOUT_MS:30000}
      # Transmissao (issue #96): tempo apos o qual uma nota presa em ENVIANDO/CANCELANDO
      # (processo derrubado no meio da transmissao) e reconciliada pelo job de sincronizacao.
      # A subida falha se este valor nao for maior que o pior caso de uma transmissao
      # (envio + consulta de reconciliacao, cada uma com retry x timeouts) — issue #83.
      transmissao:
        timeout-ms: ${NFE_SEFAZ_TRANSMISSAO_TIMEOUT_MS:600000}   # 10 min
      # Job de sincronizacao de status de notas pendentes (issue #16).
      sync:
        enabled: ${NFE_SEFAZ_SYNC_ENABLED:true}
        interval-ms: ${NFE_SEFAZ_SYNC_INTERVAL_MS:900000}   # 15 min
        # Issue #83: pendentes lidas em lotes de IDs por keyset, uma transacao curta por nota, e
        # a execucao para apos N falhas de comunicacao seguidas (SEFAZ fora do ar).
        lote-tamanho: ${NFE_SEFAZ_SYNC_LOTE_TAMANHO:100}
        max-falhas-consecutivas: ${NFE_SEFAZ_SYNC_MAX_FALHAS:5}
        # Lock distribuido entre instancias (issue #87). Teto abaixo do intervalo; o piso impede
        # que outra replica sincronize de novo logo depois desta.
        lock:
          at-most-for: ${NFE_SEFAZ_SYNC_LOCK_AT_MOST_FOR:PT14M}
          at-least-for: ${NFE_SEFAZ_SYNC_LOCK_AT_LEAST_FOR:PT10M}
  # Ceres — assistente fiscal (issues #141+).
  assistente:
    saude:
      # Timeout do health do Ollama. Proprio e curto: o health nao pode herdar o read-timeout de
      # geracao (120s) e pendurar o /actuator/health do compose.
      timeout: ${AI_HEALTH_TIMEOUT:2s}
      # O /actuator/health e publico: sem cache, cada visitante dispararia uma chamada ao Ollama.
      cache: ${AI_HEALTH_CACHE:10s}
    # Teto do laco modelo -> funcao -> modelo numa mesma pergunta (issue #142).
    max-rodadas-ferramentas: ${AI_MAX_RODADAS_FERRAMENTAS:3}
    # Perguntas processadas ao mesmo tempo; acima disso 429 (cada uma prende uma thread pelo tempo
    # de geracao do modelo).
    max-conversas-simultaneas: ${AI_MAX_CONVERSAS_SIMULTANEAS:4}
  # Apuracao mensal de IBS/CBS (issue #41 — RN004).
  apuracao:
    # Job de fechamento automatico no ultimo dia do mes as 23h (cron "0 0 23 L * *").
    fechamento:
      enabled: ${APURACAO_FECHAMENTO_ENABLED:true}
      # Desde a issue #100 cada produtor fecha em transacao propria (timeout padrao de 30s) e os
      # produtores sao lidos em lotes por keyset: nao ha mais transacao de lote para limitar.
      lote-tamanho: ${APURACAO_FECHAMENTO_LOTE_TAMANHO:100}
      # Lock distribuido (issue #87): o fechamento roda numa replica so. O piso cobre o desvio de
      # relogio entre replicas que disparam o mesmo cron.
      lock:
        at-most-for: ${APURACAO_FECHAMENTO_LOCK_AT_MOST_FOR:PT50M}
        at-least-for: ${APURACAO_FECHAMENTO_LOCK_AT_LEAST_FOR:PT5M}
  # Guias fiscais do Contador (issue #74).
  guia-fiscal:
    # Job diario que marca como VENCIDA toda guia PENDENTE com vencimento passado.
    sync:
      enabled: ${GUIA_FISCAL_SYNC_ENABLED:true}
      cron: ${GUIA_FISCAL_SYNC_CRON:0 0 1 * * *}
      # O job atualiza todas as guias vencidas numa transacao: precisa de um teto proprio,
      # acima do spring.transaction.default-timeout (30s). Em segundos.
      transaction-timeout: ${GUIA_FISCAL_SYNC_TX_TIMEOUT:600}
      # Lock distribuido (issue #87), mesmo raciocinio do fechamento.
      lock:
        at-most-for: ${GUIA_FISCAL_SYNC_LOCK_AT_MOST_FOR:PT30M}
        at-least-for: ${GUIA_FISCAL_SYNC_LOCK_AT_LEAST_FOR:PT5M}

# Tributos — IBS/CBS (EC 132/2023 + LC 214/2025)
# Alíquotas de referência para o ano-teste de 2026 (parametrizáveis sem recompilar).
# IBS: 0,10 % | CBS: 0,90 % — valores informativos; sem recolhimento efetivo em 2026.
# Desde a issue #86 são FALLBACK do AliquotaIbsCbsResolver: a alíquota efetiva de IBS vem da
# tabela aliquota_ibs_uf (por UF); estes valores só se aplicam quando a UF não consta lá.
# Ajuste conforme regulamentação complementar futura da LC 214/2025.
agrocontabil:
  tributos:
    ibs:
      aliquota: 0.0010
    cbs:
      aliquota: 0.0090
    # Crédito tributário nas notas de entrada (Sprint 4 — RN003).
    # Percentual do crédito aproveitável sobre o IBS/CBS da aquisição (0–100).
    # 100 = crédito integral (não-cumulatividade — LC 214/2025, art. 47). O crédito
    # presumido nas aquisições de produtor rural não contribuinte (arts. 164+) depende
    # de regulamentação futura — ajustar aqui quando editada, sem recompilar.
    credito:
      percentual-aproveitamento: 100

# Log base. Nunca logar senha/token — ver application-prod.yml para nivel de prod.
logging:
  level:
    root: INFO
    br.com.agrocontabil: INFO
