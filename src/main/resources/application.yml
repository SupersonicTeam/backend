# Configuracao base — compartilhada por todos os profiles.
# Profile ativo definido por SPRING_PROFILES_ACTIVE (default: dev).
spring:
  application:
    name: agrocontabil-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  jpa:
    open-in-view: false
    hibernate:
      # Schema e versionado pelo Liquibase — Hibernate nunca altera DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Documentacao OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator — somente health/info expostos por padrao; metricas vem na fase pos-basico.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Configuracoes da aplicacao (namespace proprio)
app:
  cors:
    # Lista separada por virgula; sobrescrita por APP_CORS_ALLOWED_ORIGINS em prod.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  nfe:
    # Certificado digital A1 (.p12) para assinatura da NF-e. Em prod vem de env var.
    # Nenhum segredo no repositorio — ver .env.example.
    certificado:
      path: ${NFE_CERT_PATH:}
      password: ${NFE_CERT_PASSWORD:}
      alias: ${NFE_CERT_ALIAS:}
    # Integracao SEFAZ (issue #15). Sprint 3 usa transporte mock (sandbox).
    # O envio SOAP+mTLS real com certificado ICP-Brasil e debito da Sprint 7:
    # basta definir mock.enabled=false e plugar a implementacao real de SefazTransport.
    sefaz:
      ambiente: ${NFE_SEFAZ_AMBIENTE:HOMOLOGACAO}   # HOMOLOGACAO | PRODUCAO
      mock:
        enabled: ${NFE_SEFAZ_MOCK_ENABLED:true}
      retry:
        max-attempts: ${NFE_SEFAZ_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${NFE_SEFAZ_RETRY_BACKOFF_MS:1000}
      # Job de sincronizacao de status de notas pendentes (issue #16).
      sync:
        enabled: ${NFE_SEFAZ_SYNC_ENABLED:true}
        interval-ms: ${NFE_SEFAZ_SYNC_INTERVAL_MS:900000}   # 15 min

# Tributos — IBS/CBS (EC 132/2023 + LC 214/2025)
# Alíquotas de referência para o ano-teste de 2026 (parametrizáveis sem recompilar).
# IBS: 0,10 % | CBS: 0,90 % — valores informativos; sem recolhimento efetivo em 2026.
# Ajuste conforme regulamentação complementar futura da LC 214/2025.
agrocontabil:
  tributos:
    ibs:
      aliquota: 0.0010
    cbs:
      aliquota: 0.0090

# Log base. Nunca logar senha/token — ver application-prod.yml para nivel de prod.
logging:
  level:
    root: INFO
    br.com.agrocontabil: INFO
