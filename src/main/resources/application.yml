# Configuracao base — compartilhada por todos os profiles.
# Profile ativo definido por SPRING_PROFILES_ACTIVE (default: dev).
spring:
  application:
    name: agrocontabil-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      # Schema e versionado pelo Liquibase — Hibernate nunca altera DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Documentacao OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator — somente health/info expostos por padrao; metricas vem na fase pos-basico.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Configuracoes da aplicacao (namespace proprio)
app:
  cors:
    # Lista separada por virgula; sobrescrita por APP_CORS_ALLOWED_ORIGINS em prod.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Log base. Nunca logar senha/token — ver application-prod.yml para nivel de prod.
logging:
  level:
    root: INFO
    br.com.agrocontabil: INFO
