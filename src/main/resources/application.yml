# Configuracao base — compartilhada por todos os profiles.
# Profile ativo: SPRING_PROFILES_ACTIVE, SEM default (issue #219). Sem exatamente um profile de
# ambiente (dev | homolog | prod | test) a aplicacao recusa a subida — ver
# ProfileObrigatorioEnvironmentPostProcessor. Local, ./mvnw spring-boot:run ja ativa dev (pom.xml).
# Nunca recolocar spring.profiles.active aqui: o antigo default dev ligava, num deploy sem a
# variavel, segredo JWT efemero, identidade por header e chave de cifra de desenvolvimento.
spring:
  application:
    name: agrocontabil-backend

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  # Pool de conexoes JDBC (issue #98). Todos os valores sao parametrizaveis por env — ver
  # .env.example. Nenhuma propriedade especifica do PostgreSQL entra aqui: o driver H2 usado nos
  # testes rejeita propriedades JDBC desconhecidas. O statement_timeout vive em
  # application-dev.yml / application-prod.yml.
  datasource:
    hikari:
      pool-name: agrocontabil-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Quanto uma thread espera por uma conexao livre antes de falhar rapido, em vez de
      # enfileirar requisicoes indefinidamente.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}          # 10 min
      # Aposenta a conexao antes de qualquer timeout de infraestrutura (firewall/pgbouncer).
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}         # 30 min
      # Loga (WARN, com stack trace) a conexao que ficou fora do pool tempo demais — e o que
      # torna visivel um vazamento de conexao. Precisa ser MENOR que max-lifetime, senao o
      # Hikari desativa a deteccao. Valores abaixo de 2000 ms sao ignorados.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:30000}   # 30 s
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}

  # Teto para qualquer transacao sem timeout explicito: impede que uma transacao presa segure
  # uma conexao do pool indefinidamente. Generoso o bastante para importacao de lote de XML,
  # geracao de DANFE e fechamento mensal.
  transaction:
    default-timeout: ${DB_TX_TIMEOUT:30s}

  # Agendamento dos jobs (issue #101). Sem estas propriedades o Boot cria um scheduler de UMA
  # thread e os tres jobs (SefazStatusSyncJob, ApuracaoFechamentoJob, GuiaFiscalStatusSyncJob)
  # disputam entre si — um job lento atrasa os demais.
  # Concorrencia entre INSTANCIAS (lock distribuido) e a issue #87, nao esta coberta aqui.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:3}          # uma thread por job; 1 volta ao comportamento serializado
      thread-name-prefix: agro-sched-
      shutdown:
        # Espera o job em andamento terminar antes de encerrar. Desde a issue #100 o fechamento
        # mensal commita produtor a produtor e para entre dois produtores ao ser interrompido: os
        # ja fechados ficam FECHADOS e os restantes ABERTOS para o proximo disparo.
        await-termination: true
        await-termination-period: ${SCHEDULER_SHUTDOWN_TIMEOUT:30s}

  # Janela para cada fase do encerramento concluir (requisicoes em voo, jobs, pool).
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  # Upload de XML para importacao de notas (issue #19). Limites conservadores: um XML de
  # NF-e assinado costuma ter dezenas de KB; permitimos lotes de varios arquivos.
  servlet:
    multipart:
      # 5 MB pelos anexos das pendencias (#180); o XML de NF-e importado segue com 2 MB, conferido
      # no ImportacaoNotaFiscalService.
      max-file-size: 5MB
      max-request-size: 20MB

  jpa:
    open-in-view: false
    hibernate:
      # Schema e versionado pelo Liquibase — Hibernate nunca altera DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        # Batch fetching: transforma o N+1 de colecoes/proxies LAZY (ex.: os itens e o produtor
        # de cada nota na listagem paginada de /api/notas) em poucas queries com IN(...),
        # em vez de 1 query por nota. Mitiga o N+1 sem quebrar a paginacao (ao contrario de
        # JOIN FETCH com Pageable, que pagina em memoria — HHH000104).
        default_batch_fetch_size: 25

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Cliente SMTP (issue #460). Host, porta, usuario e senha vem de SPRING_MAIL_HOST/PORT/USERNAME/
  # PASSWORD, so no .env. Sem host nao ha cliente; com EMAIL_MODO=SMTP, host ou credencial vazios
  # impedem a subida (EmailConfig). Os timeouts impedem que um provedor lento prenda o pool
  # agro-email- (sem eles o JavaMail espera para sempre).
  mail:
    properties:
      mail:
        smtp:
          auth: true
          # STARTTLS obrigatorio na 587: sem o "required", um servidor (ou um intermediario) que
          # nao anuncie STARTTLS receberia a senha em claro. Na 465, EMAIL_SMTP_SSL=true e
          # EMAIL_SMTP_STARTTLS=false.
          starttls:
            enable: ${EMAIL_SMTP_STARTTLS:true}
            required: ${EMAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${EMAIL_SMTP_SSL:false}
            checkserveridentity: true
          connectiontimeout: ${EMAIL_SMTP_CONNECT_TIMEOUT_MS:5000}
          timeout: ${EMAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${EMAIL_SMTP_TIMEOUT_MS:10000}

  # Timeouts dos clientes HTTP criados pelo Boot (issue #141). Hoje os unicos consumidores sao os
  # clientes do Spring AI (Ollama / API compativel com a da OpenAI): o projeto nao tinha nenhum
  # RestClient/WebClient antes. O read-timeout e generoso porque um modelo local em CPU pode levar
  # dezenas de segundos para responder; o connect-timeout e curto para falhar rapido com o Ollama
  # fora do ar.
  http:
    client:
      connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_READ_TIMEOUT:120s}
    reactiveclient:
      connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_READ_TIMEOUT:120s}

  # Ceres — assistente fiscal (issue #141). Arquitetura: Tool Calling + RAG + orquestracao.
  ai:
    model:
      # Provedor do modelo de chat: "ollama" (local, padrao), "openai" (qualquer API compativel
      # com a da OpenAI: OpenAI, Maritaca...) ou "anthropic" (Claude). Trocar e so configuracao.
      chat: ${AI_CHAT_PROVIDER:ollama}
      # Embedding e SEMPRE local (bge-m3, 1024 dimensoes). Nao e env var de proposito: trocar o
      # modelo de embedding obriga a reindexar toda a legislacao (issue #156).
      embedding: ollama
      # O starter da OpenAI tambem autoconfigura imagem, audio e moderacao, cada um exigindo chave
      # de API na subida. Desligados: a Ceres so usa chat.
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      # Os modelos sao baixados pelo servico ollama-init do compose. Puxar na subida do backend
      # (when_missing) bloquearia a aplicacao por minutos na primeira vez e a impediria de subir
      # com o Ollama fora do ar — e o resto do sistema nao depende do modelo.
      init:
        pull-model-strategy: ${AI_OLLAMA_PULL_STRATEGY:never}
      chat:
        options:
          # qwen3:4b-instruct (Qwen3-4B-Instruct-2507), NAO qwen3:4b: desde a versao 2507 a tag
          # qwen3:4b e a variante "thinking", que raciocina sempre e ignora think=false — despeja o
          # raciocinio no texto (500-1000 tokens, 80-120 s em CPU so para classificar). A instruct
          # classifica em ~20 tokens.
          model: ${AI_CHAT_MODEL:qwen3:4b-instruct}
          # Temperatura baixa: a Ceres redige a partir de dados e trechos de lei, nao cria.
          temperature: 0.2
          # Janela de contexto explicita. Estourada, o Ollama descarta o INICIO do prompt — onde
          # fica a instrucao de sistema com as regras da Ceres. O qwen3 suporta 32k.
          num-ctx: ${AI_OLLAMA_NUM_CTX:8192}
          # Teto GERAL de tokens gerados: cada chamada da Ceres manda o seu (app.assistente.tetos,
          # #270), que tambem entra na reserva da cota (#166); este so vale para chamada sem teto.
          num-predict: ${AI_MAX_TOKENS:1024}
          # O qwen3 raciocina por padrao; os tokens de raciocinio consomem o num-predict (resposta
          # cortada) e multiplicam a latencia em CPU. Os numeros da Ceres vem das funcoes, nao do
          # raciocinio do modelo. Vazio = nao enviar (modelo sem suporte). Ver ThinkOptionConverter.
          think-option: ${AI_OLLAMA_THINK:false}
      embedding:
        options:
          model: bge-m3
    openai:
      # Chave SOMENTE por variavel de ambiente — nunca no repositorio.
      api-key: ${AI_API_KEY:}
      base-url: ${AI_API_BASE_URL:https://api.openai.com}
      chat:
        # Provedores compativeis nem sempre usam o prefixo /v1 da OpenAI (ex.: a Maritaca expoe
        # <base>/chat/completions).
        completions-path: ${AI_API_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
          max-tokens: ${AI_MAX_TOKENS:1024}
    # API da Anthropic (Claude), com spring.ai.model.chat=anthropic. Chave propria, para nao se
    # misturar com a de um provedor compativel com a OpenAI.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:claude-haiku-5-5}
          # Os modelos atuais recusam (400) temperatura diferente do padrao; 1.0 e o padrao da API.
          # Sem esta linha o Spring AI mandaria a dele (0.8).
          temperature: 1.0
          max-tokens: ${AI_MAX_TOKENS:1024}
          # O raciocinio vem ligado e gasta o teto de cada chamada (app.assistente.tetos, #270):
          # resposta cortada. O Haiku 5.5 aceita desligar; Opus 5.5 e Sonnet 5.5 nao (400).
          thinking:
            type: ${AI_ANTHROPIC_THINKING:disabled}
    # Retry curto: a pergunta do usuario esta esperando. Erro 4xx (chave invalida, requisicao
    # malformada) nao melhora repetindo.
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      on-client-errors: false
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    # Nunca registrar prompt, resposta ou conteudo de ferramenta em log/observacao: carregam dados
    # do produtor (issue #144). Os padroes ja sao false; explicitos para nao depender deles.
    chat:
      observations:
        log-prompt: false
        log-completion: false
    tools:
      observations:
        include-content: false
    # Base de legislacao da Ceres (issue #156). O schema e do Liquibase (changeSet 0026): o Spring AI
    # nao cria nem valida nada. Dimensao fixa: sem ela o PgVectorStore pergunta ao modelo de
    # embedding na subida (rede) e, falhando, assume 1536 — incompativel com o bge-m3 (1024).
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: false
        table-name: legislacao_trecho
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        max-document-batch-size: 100

# Ao receber SIGTERM o Tomcat para de aceitar conexoes novas e espera as requisicoes ativas
# terminarem, em vez de corta-las no meio (issue #101). O compose usa stop_grace_period: 35s
# para nao matar o processo antes desta janela.
# ATENCAO (issue #125): este bloco fica DEPOIS de todo o spring:. Inserido no meio dele, na
# coluna 0, ele prende as chaves seguintes (jpa, servlet, liquibase) como server.* — que o Spring
# ignora em silencio. ApplicationYamlEstruturaTest trava isso.
server:
  shutdown: graceful

# Documentacao OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator — somente health/info expostos por padrao; metricas vem na fase pos-basico.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # DEGRADED (issue #141): o Ollama fora do ar ou sem o modelo nao derruba o health. O resto do
      # sistema funciona sem a Ceres; DOWN faria o healthcheck do compose reiniciar um backend
      # saudavel. Status fora do http-mapping respondem 200.
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
  # Sem o health do SMTP (issue #460). Com spring.mail.host presente, mesmo vazio (o compose o passa
  # assim), o Boot cria o cliente e o MailHealthIndicator, que poe o /actuator/health em DOWN quando
  # o provedor cai ou o host esta vazio, e o deploy.sh reverte o deploy. A falha de envio fica no log.
  health:
    mail:
      enabled: false

# Configuracoes da aplicacao (namespace proprio)
app:
  # Demonstracao da banca (issue #315): escritorio, carteira, notas e a cota da Ceres no limite,
  # com a SEED_SENHA. So em dev/homolog/test: com ela ligada em prod a aplicacao nao sobe.
  demonstracao:
    habilitada: ${DEMONSTRACAO_HABILITADA:false}
  # Busca das notas (issue #174): preenche na subida a busca_normalizada das notas gravadas antes
  # do changeSet 0037, com a mesma normalizacao Java da gravacao (NormalizacaoBusca).
  notas:
    busca:
      preencher-legado: ${NOTAS_BUSCA_PREENCHER_LEGADO:true}
    # Tabela oficial de reducao (issue #272): recalcula na subida o IBS/CBS das notas ainda nao
    # emitidas calculadas antes do changeSet 0048 (sem o tratamento aplicado gravado).
    tributos:
      recalcular-legado: ${NOTAS_TRIBUTOS_RECALCULAR_LEGADO:true}
  # E-mail transacional (issue #460). O modo e o remetente seguem em app.seguranca.redefinicao.
  # Com EMAIL_MODO=SMTP o remetente tem de ser deste dominio, o verificado no provedor (SPF/DKIM):
  # de outro, o e-mail sai sem DKIM alinhado e cai no spam ou e recusado.
  email:
    dominio-verificado: ${EMAIL_DOMINIO_VERIFICADO:agroconia.com.br}
    # Respostas vao para a GWNext: o remetente nao recebe e-mail.
    reply-to: ${EMAIL_REPLY_TO:contato@gwnext.com.br}
    # Teto de envios por SMTP em janelas deslizantes (0 = sem teto), abaixo da cota do provedor:
    # Resend Free (100/dia UTC) = 0 por hora e 80 por dia. No Pro, suba o diario sem zera-lo: o teto
    # tambem segura abuso e bounce. Acima, o e-mail e descartado e a resposta continua 202. Em
    # memoria (uma replica so).
    teto-por-hora: ${EMAIL_TETO_POR_HORA:0}
    teto-por-dia: ${EMAIL_TETO_POR_DIA:80}
    # Links de "esqueci minha senha" seguidos por conta; depois, um a cada 24 h / este numero
    # (com 5, um a cada 4,8 h).
    links-redefinicao-por-dia: ${EMAIL_LINKS_REDEFINICAO_POR_DIA:5}
    # Destinos que nunca recebem (RFC 2606/6761): as contas do seed sao @example.com.
    dominios-reservados: example.com,example.net,example.org,.example,.test,.invalid,.local,.localhost
  # Carteira do contador (issue #177): convite por e-mail, aceito pelo produtor. O link leva a
  # pagina /escritorio do produtor, onde ficam os convites (o frontend nao tem /convites, #460).
  carteira:
    convite:
      validade: ${CARTEIRA_CONVITE_VALIDADE:P14D}
      url-frontend: ${CARTEIRA_CONVITE_URL_FRONTEND:http://localhost:4200/escritorio}
      max-por-dia: ${CARTEIRA_CONVITE_MAX_POR_DIA:30}
      retencao: ${CARTEIRA_CONVITE_RETENCAO:P30D}
      limpeza:
        enabled: ${CARTEIRA_CONVITE_LIMPEZA_ENABLED:true}
        cron: ${CARTEIRA_CONVITE_LIMPEZA_CRON:0 15 3 * * *}
        lock:
          at-most-for: PT30M
          at-least-for: PT5M
  # Pendencias e documentos (issue #180): anexos guardados por 5 anos (minimo; guarda fiscal).
  pendencias:
    anexo:
      retencao-anos: ${PENDENCIAS_ANEXO_RETENCAO_ANOS:5}
      retencao:
        enabled: ${PENDENCIAS_ANEXO_RETENCAO_ENABLED:true}
        cron: ${PENDENCIAS_ANEXO_RETENCAO_CRON:0 45 3 * * *}
        lock:
          at-most-for: PT30M
          at-least-for: PT5M
    # Antivirus dos anexos (issue #227): ClamAV (clamd) por TCP. Falha fechada — com o clamd fora
    # do ar o anexo fica EM_VERIFICACAO (nao pode ser baixado) e o job reverifica. SEM_VERIFICACAO
    # so sobe em dev/test.
    antivirus:
      modo: ${ANTIVIRUS_MODO:CLAMAV}
      host: ${ANTIVIRUS_HOST:localhost}
      porta: ${ANTIVIRUS_PORTA:3310}
      connect-timeout: ${ANTIVIRUS_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${ANTIVIRUS_READ_TIMEOUT:PT30S}
      lote-tamanho: ${ANTIVIRUS_LOTE_TAMANHO:20}
      reverificacao:
        enabled: ${ANTIVIRUS_REVERIFICACAO_ENABLED:true}
        intervalo-ms: ${ANTIVIRUS_REVERIFICACAO_INTERVALO_MS:120000}
        lock:
          at-most-for: PT15M
          at-least-for: PT1M
  # Notificacao por WhatsApp (issue #182): so o registro na v1 (porta EnvioNotificacao). Teto de
  # disparos manuais por produtor por hora; aviso automatico do que vence amanha as 9h; retencao.
  notificacao:
    max-por-hora: ${NOTIFICACAO_MAX_POR_HORA:10}
    retencao-dias: ${NOTIFICACAO_RETENCAO_DIAS:365}
    aviso:
      enabled: ${NOTIFICACAO_AVISO_ENABLED:true}
      cron: ${NOTIFICACAO_AVISO_CRON:0 0 9 * * *}
      lock:
        at-most-for: PT30M
        at-least-for: PT5M
    retencao:
      enabled: ${NOTIFICACAO_RETENCAO_ENABLED:true}
      cron: ${NOTIFICACAO_RETENCAO_CRON:0 0 4 * * *}
      lock:
        at-most-for: PT30M
        at-least-for: PT5M
  # Equipe do escritorio (issue #228): convite com token de uso unico no fragmento do link.
  escritorio:
    # Endereco proprio do escritorio, {slug}.{dominio-base} (issue #464): o subdominio identifica o
    # escritorio e nunca autoriza nada. Uma gravacao de slug por intervalo; o slug que sai fica em
    # carencia (ninguem o registra). Em dev o dominio base e localhost (ruraloeste.localhost).
    dominio-base: ${APP_ESCRITORIO_DOMINIO_BASE:agroconia.com.br}
    # Segredo do "ask" do On-Demand TLS do Caddy (GET /interno/tls/permitido): o Caddy o manda na
    # URL e o backend o confere em tempo constante. Vazio = o ask recusa tudo (nenhum certificado
    # de subdominio). 32+ caracteres: openssl rand -hex 32.
    tls-ask-chave: ${APP_ESCRITORIO_TLS_ASK_CHAVE:}
    # Endpoint publico do escritorio (GET /api/publico/escritorios/{slug}): limite por IP.
    publico:
      por-minuto: ${APP_ESCRITORIO_PUBLICO_POR_MINUTO:30}
    endereco:
      intervalo-troca: P30D
      carencia: P90D
      # Apaga os slugs com a carencia vencida (podem ser dado pessoal): todo dia, numa replica so.
      limpeza:
        enabled: ${ESCRITORIO_ENDERECO_LIMPEZA_ENABLED:true}
        cron: ${ESCRITORIO_ENDERECO_LIMPEZA_CRON:0 20 3 * * *}
        lock:
          at-most-for: PT30M
          at-least-for: PT5M
    convite:
      validade: ${ESCRITORIO_CONVITE_VALIDADE:P7D}
      url-frontend: ${ESCRITORIO_CONVITE_URL_FRONTEND:http://localhost:4200/equipe/convite}
      max-por-dia: ${ESCRITORIO_CONVITE_MAX_POR_DIA:30}
  cors:
    # Lista separada por virgula; sobrescrita por APP_CORS_ALLOWED_ORIGINS em prod.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Politica de dados (LGPD, #148): controlador e canal do encarregado exibidos em
  # GET /api/politica-dados. O controlador e a GWNext, dona do AgroConIA.
  # Auditoria das operacoes criticas (Sprint 8, #149 — RNF012). Retencao nunca abaixo de 5 anos
  # (a aplicacao nao sobe); o job roda numa replica so (ShedLock).
  auditoria:
    retencao-anos: ${AUDITORIA_RETENCAO_ANOS:5}
    retencao:
      enabled: ${AUDITORIA_RETENCAO_ENABLED:true}
      cron: ${AUDITORIA_RETENCAO_CRON:0 30 3 * * *}
      lock:
        at-most-for: PT30M
        at-least-for: PT5M
  lgpd:
    controlador: ${LGPD_CONTROLADOR:GWNext}
    contato-encarregado: ${LGPD_CONTATO_ENCARREGADO:contato@gwnext.com.br}
    versao-politica: 2026-11-09
  # Autenticacao (Sprint 8).
  seguranca:
    senha:
      # Fator de custo do BCrypt (#205). 12 = ~250 ms por hash; nao baixar em producao.
      bcrypt-custo: ${SENHA_BCRYPT_CUSTO:12}
    # JWT de acesso (#206). Sem JWT_SECRET (>= 32 bytes, aleatorio) a aplicacao nao sobe, exceto
    # em dev/test, que ligam permitir-segredo-efemero. Gere com: openssl rand -base64 48
    # Dados pessoais cifrados em repouso (#147): AES-256-GCM deterministico (ver CifraDeterministica).
    # 32 bytes aleatorios em Base64 (openssl rand -base64 32). Sem ela, a aplicacao nao sobe fora de
    # dev/test. Perder a chave = perder os dados pessoais: guardar como o segredo do banco.
    cripto:
      chave: ${CRIPTO_CHAVE:}
      migrar-legado: ${CRIPTO_MIGRAR_LEGADO:true}
    jwt:
      segredo: ${JWT_SECRET:}
      emissor: ${JWT_EMISSOR:agrocontabil-backend}
      audiencia: ${JWT_AUDIENCIA:agrocontabil-api}
      validade: ${JWT_VALIDADE:PT15M}
      tolerancia-relogio: PT30S
    # Protecao contra forca bruta (#208): bloqueio por conta e limite por IP (em memoria, por
    # replica). Atras de proxy, o IP real so chega com server.forward-headers-strategy=native.
    forca-bruta:
      max-falhas: ${FORCA_BRUTA_MAX_FALHAS:5}
      bloqueio: ${FORCA_BRUTA_BLOQUEIO:PT15M}
      login-por-minuto: ${LIMITE_LOGIN_POR_MINUTO:10}
      cadastro-por-minuto: ${LIMITE_CADASTRO_POR_MINUTO:5}
      refresh-por-minuto: ${LIMITE_REFRESH_POR_MINUTO:30}
      senha-por-minuto: ${LIMITE_SENHA_POR_MINUTO:5}
      max-ips: 10000
    # Limite geral da API (#150): por identidade (ou IP sem identidade), em memoria, por replica.
    limite:
      geral-por-minuto: ${LIMITE_GERAL_POR_MINUTO:100}
      chat-por-minuto: ${LIMITE_CHAT_POR_MINUTO:20}
      max-chaves: 10000
    # Recuperacao de senha (#209). modo-email: SMTP (prod, com spring.mail.*), LOG (so dev: o link
    # vai para o log; proibido em prod) ou DESLIGADO. O modo e o remetente valem para os tres
    # e-mails (redefinicao e os dois convites). Remetente com nome: "AgroConIA <x@dominio>".
    redefinicao:
      validade: ${REDEFINICAO_VALIDADE:PT30M}
      url-frontend: ${REDEFINICAO_URL_FRONTEND:http://localhost:4200/redefinir-senha}
      modo-email: ${EMAIL_MODO:DESLIGADO}
      remetente: ${EMAIL_REMETENTE:nao-responda@agroconia.local}
    # Refresh token rotativo em cookie HttpOnly (#207).
    refresh:
      validade: ${REFRESH_VALIDADE:P7D}
      # Vida maxima da sessao desde o login: a renovacao nunca passa disso.
      vida-maxima: ${REFRESH_VIDA_MAXIMA:P30D}
      cookie-nome: agro_refresh
      # Secure: so por HTTPS. Desligar so em dev sobre HTTP (application-dev.yml).
      cookie-seguro: ${REFRESH_COOKIE_SEGURO:true}
      cookie-same-site: Strict
      cookie-caminho: /api/auth
      retencao: P7D
      limpeza:
        enabled: ${REFRESH_LIMPEZA_ENABLED:true}
        cron: ${REFRESH_LIMPEZA_CRON:0 0 3 * * *}
        lock:
          at-most-for: PT30M
          at-least-for: PT5M
  nfe:
    # Certificado digital A1 (.p12) para assinatura da NF-e. Em prod vem de env var.
    # Nenhum segredo no repositorio — ver .env.example.
    certificado:
      path: ${NFE_CERT_PATH:}
      password: ${NFE_CERT_PASSWORD:}
      alias: ${NFE_CERT_ALIAS:}
    # Integracao SEFAZ (issue #15). Sprint 3 usa transporte mock (sandbox).
    # O envio SOAP+mTLS real com certificado ICP-Brasil e debito da Sprint 7:
    # basta definir mock.enabled=false e plugar a implementacao real de SefazTransport.
    sefaz:
      ambiente: ${NFE_SEFAZ_AMBIENTE:HOMOLOGACAO}   # HOMOLOGACAO | PRODUCAO
      mock:
        enabled: ${NFE_SEFAZ_MOCK_ENABLED:true}
      # Transporte real SOAP + mTLS (issue #128), ativo com mock.enabled=false. Enderecos por
      # ambiente e UF autorizadora (ou PADRAO), so por env/config, nunca fixos no codigo:
      #   app.nfe.sefaz.webservices.homologacao.PADRAO.autorizacao / consulta / evento
      #   (env: APP_NFE_SEFAZ_WEBSERVICES_HOMOLOGACAO_PADRAO_AUTORIZACAO etc.)
      # Ver docs/sefaz-transporte-soap.md. Cadeia ICP-Brasil dos servidores da SEFAZ:
      truststore:
        path: ${NFE_SEFAZ_TRUSTSTORE_PATH:}
        password: ${NFE_SEFAZ_TRUSTSTORE_PASSWORD:}
      # Retry (issue #83): envio e cancelamento so re-tentam falha de CONEXAO (nada saiu); a
      # consulta de status, que e leitura, re-tenta qualquer falha de comunicacao.
      retry:
        max-attempts: ${NFE_SEFAZ_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${NFE_SEFAZ_RETRY_BACKOFF_MS:1000}
      # Timeouts de rede do transporte real (issue #83). O mock os ignora. Conexao e leitura
      # separados: e o que permite ao transporte dizer se a requisicao saiu ou nao.
      timeout:
        connect-ms: ${NFE_SEFAZ_CONNECT_TIMEOUT_MS:10000}
        read-ms: ${NFE_SEFAZ_READ_TIMEOUT_MS:30000}
      # Transmissao (issue #96): tempo apos o qual uma nota presa em ENVIANDO/CANCELANDO
      # (processo derrubado no meio da transmissao) e reconciliada pelo job de sincronizacao.
      # A subida falha se este valor nao for maior que o pior caso de uma transmissao
      # (envio + consulta de reconciliacao, cada uma com retry x timeouts) — issue #83.
      transmissao:
        timeout-ms: ${NFE_SEFAZ_TRANSMISSAO_TIMEOUT_MS:600000}   # 10 min
      # Job de sincronizacao de status de notas pendentes (issue #16).
      sync:
        enabled: ${NFE_SEFAZ_SYNC_ENABLED:true}
        interval-ms: ${NFE_SEFAZ_SYNC_INTERVAL_MS:900000}   # 15 min
        # Issue #83: pendentes lidas em lotes de IDs por keyset, uma transacao curta por nota, e
        # a execucao para apos N falhas de comunicacao seguidas (SEFAZ fora do ar).
        lote-tamanho: ${NFE_SEFAZ_SYNC_LOTE_TAMANHO:100}
        max-falhas-consecutivas: ${NFE_SEFAZ_SYNC_MAX_FALHAS:5}
        # Lock distribuido entre instancias (issue #87). Teto abaixo do intervalo; o piso impede
        # que outra replica sincronize de novo logo depois desta.
        lock:
          at-most-for: ${NFE_SEFAZ_SYNC_LOCK_AT_MOST_FOR:PT14M}
          at-least-for: ${NFE_SEFAZ_SYNC_LOCK_AT_LEAST_FOR:PT10M}
  # Ceres — assistente fiscal (issues #141+).
  assistente:
    saude:
      # Timeout do health do Ollama. Proprio e curto: o health nao pode herdar o read-timeout de
      # geracao (120s) e pendurar o /actuator/health do compose.
      timeout: ${AI_HEALTH_TIMEOUT:2s}
      # O /actuator/health e publico: sem cache, cada visitante dispararia uma chamada ao Ollama.
      cache: ${AI_HEALTH_CACHE:10s}
    # Perguntas processadas ao mesmo tempo (= tamanho do pool agro-ceres-); acima disso 503
    # ASSISTENTE_OCUPADO com Retry-After. Alem do teto global, no maximo uma por produtor (#157).
    max-conversas-simultaneas: ${AI_MAX_CONVERSAS_SIMULTANEAS:4}
    # RAG (issue #156): quantos trechos de lei recuperar e a similaridade minima (cosseno, 0 a 1).
    # Abaixo do limiar o trecho nao entra: melhor "nao encontrei fundamento" do que citar lei que nao
    # trata do assunto.
    rag:
      top-k: ${AI_RAG_TOP_K:5}
      similaridade-minima: ${AI_RAG_SIMILARIDADE_MINIMA:0.55}
    # Orquestracao (issue #157): abaixo desta confianca do classificador, a pergunta vira "fora de
    # escopo" (resposta fixa, sem nova chamada ao modelo).
    orquestracao:
      confianca-minima: ${AI_CONFIANCA_MINIMA:0.5}
    # Classificacao em camadas (issue #265): regras -> embeddings (kNN no BGE-M3 sobre o treino
    # em ceres/treino/) -> modelo so no desempate e na pergunta de lei do MISTO.
    classificacao:
      camadas: ${AI_CLASSIFICACAO_CAMADAS:true}
      limiar-confianca: ${AI_CLASSIFICACAO_LIMIAR:0.6}
      vizinhos: ${AI_CLASSIFICACAO_VIZINHOS:7}
      similaridade-minima: ${AI_CLASSIFICACAO_SIMILARIDADE_MINIMA:0.5}
      # Prazo do embedding da pergunta; vencido, o modelo desempata e a camada pausa.
      timeout-embedding: ${AI_CLASSIFICACAO_TIMEOUT_EMBEDDING:500ms}
      pausa-apos-falha: ${AI_CLASSIFICACAO_PAUSA_APOS_FALHA:30s}
    # Cota semanal de creditos (issue #166). creditos = ceil((entrada x peso-entrada + saida x
    # peso-saida) x fator do modelo / tokens-por-credito). Semana de segunda a domingo (Brasilia),
    # sem acumulo. Antes de cada pergunta reserva-se o teto dela; no fim, o consumo real. Teto = 3
    # chamadas (classificacao, funcoes, lei; o pior caso e o MISTO com desempate), cada uma com o
    # teto de entrada abaixo e o proprio teto de saida de app.assistente.tetos (#270).
    cota:
      habilitada: ${AI_COTA_HABILITADA:true}
      plano: ${AI_COTA_PLANO:padrao}
      creditos-por-semana-produtor: ${AI_COTA_CREDITOS_PRODUTOR:1000}
      creditos-por-semana-escritorio: ${AI_COTA_CREDITOS_ESCRITORIO:5000}
      peso-entrada: ${AI_COTA_PESO_ENTRADA:1.0}
      peso-saida: ${AI_COTA_PESO_SAIDA:4.0}
      tokens-por-credito: ${AI_COTA_TOKENS_POR_CREDITO:1000}
      fator-padrao: ${AI_COTA_FATOR_PADRAO:1.0}
      # Padrao = a janela do Ollama (o maior prompt que ele aceita); abaixo dela nao sobe.
      teto-tokens-entrada-por-chamada: ${AI_COTA_TETO_ENTRADA:${spring.ai.ollama.chat.options.num-ctx:8192}}
    # Teto de tokens gerados por tipo de chamada ao modelo (#270), cada um <= metade do contexto;
    # fora disso a aplicacao nao sobe. Sao tambem a saida da reserva da cota (#166). Resposta cortada
    # pelo teto nunca sai como completa (classificacao vira indeterminada, dados e lei descartam).
    tetos:
      # Escolha das funcoes de dados: so o JSON das chamadas.
      funcoes: ${AI_TETO_FUNCOES:512}
      # JSON da classificacao, inclusive a perguntaLei do MISTO (mesma chamada).
      classificacao: ${AI_TETO_CLASSIFICACAO:256}
      # Resposta de lei. Padrao = o teto unico de antes; 512 e o recomendado a confirmar na VPS.
      legislacao: ${AI_TETO_LEGISLACAO:1024}
      # A janela do Ollama (mesma propriedade do num-ctx), so para validar os tetos.
      contexto: ${spring.ai.ollama.chat.options.num-ctx:8192}
    # Modo fallback (issue #146): com o modelo fora, trechos de lei por busca textual (tsvector) e
    # atalhos para as telas. Depois de uma falha, as perguntas pulam o modelo durante a pausa.
    fallback:
      pausa-apos-falha: ${AI_FALLBACK_PAUSA_APOS_FALHA:30s}
      max-trechos: ${AI_FALLBACK_MAX_TRECHOS:3}
      tamanho-maximo-trecho: ${AI_FALLBACK_TAMANHO_MAXIMO_TRECHO:600}
    # Isolamento de recursos (issue #157). Tempo total de uma pergunta (tambem o timeout do SSE) e
    # de cada consulta de funcao ao banco (vira timeout de transacao, resolucao de segundos).
    timeout-pergunta: ${AI_TIMEOUT_PERGUNTA:5m}
    timeout-funcao: ${AI_TIMEOUT_FUNCAO:10s}
  # Apuracao mensal de IBS/CBS (issue #41 — RN004).
  apuracao:
    # Job de fechamento automatico no ultimo dia do mes as 23h (cron "0 0 23 L * *").
    fechamento:
      enabled: ${APURACAO_FECHAMENTO_ENABLED:true}
      # Desde a issue #100 cada produtor fecha em transacao propria (timeout padrao de 30s) e os
      # produtores sao lidos em lotes por keyset: nao ha mais transacao de lote para limitar.
      lote-tamanho: ${APURACAO_FECHAMENTO_LOTE_TAMANHO:100}
      # Lock distribuido (issue #87): o fechamento roda numa replica so. O piso cobre o desvio de
      # relogio entre replicas que disparam o mesmo cron.
      lock:
        at-most-for: ${APURACAO_FECHAMENTO_LOCK_AT_MOST_FOR:PT50M}
        at-least-for: ${APURACAO_FECHAMENTO_LOCK_AT_LEAST_FOR:PT5M}
  # Alertas tributarios (issue #140, RN010): guia, apuracao e prazo de cancelamento de NF-e que
  # vencem em menos de 5 dias. Cron de 6 campos (o do Spring), fuso de Brasilia.
  alertas:
    enabled: ${ALERTAS_ENABLED:true}
    cron: ${ALERTAS_CRON:0 0 9 * * *}
    # Lock distribuido (issue #87): uma replica gera; o piso cobre o desvio de relogio.
    lock:
      at-most-for: ${ALERTAS_LOCK_AT_MOST_FOR:PT30M}
      at-least-for: ${ALERTAS_LOCK_AT_LEAST_FOR:PT5M}
    # Uma transacao para a execucao inteira: teto proprio, acima do default de 30s. Em segundos.
    transaction-timeout: ${ALERTAS_TX_TIMEOUT:600}
  # Guias fiscais do Contador (issue #74).
  guia-fiscal:
    # Job diario que marca como VENCIDA toda guia PENDENTE com vencimento passado.
    sync:
      enabled: ${GUIA_FISCAL_SYNC_ENABLED:true}
      cron: ${GUIA_FISCAL_SYNC_CRON:0 0 1 * * *}
      # O job atualiza todas as guias vencidas numa transacao: precisa de um teto proprio,
      # acima do spring.transaction.default-timeout (30s). Em segundos.
      transaction-timeout: ${GUIA_FISCAL_SYNC_TX_TIMEOUT:600}
      # Lock distribuido (issue #87), mesmo raciocinio do fechamento.
      lock:
        at-most-for: ${GUIA_FISCAL_SYNC_LOCK_AT_MOST_FOR:PT30M}
        at-least-for: ${GUIA_FISCAL_SYNC_LOCK_AT_LEAST_FOR:PT5M}

# Tributos — IBS/CBS (EC 132/2023 + LC 214/2025)
# Alíquotas de referência para o ano-teste de 2026 (parametrizáveis sem recompilar).
# IBS: 0,10 % | CBS: 0,90 % — valores informativos; sem recolhimento efetivo em 2026.
# Desde a issue #86 são FALLBACK do AliquotaIbsCbsResolver: a alíquota efetiva de IBS vem da
# tabela aliquota_ibs_uf (por UF); estes valores só se aplicam quando a UF não consta lá.
# Ajuste conforme regulamentação complementar futura da LC 214/2025.
agrocontabil:
  tributos:
    ibs:
      aliquota: 0.0010
    cbs:
      aliquota: 0.0090
    # Crédito tributário nas notas de entrada (Sprint 4 — RN003).
    # Percentual do crédito aproveitável sobre o IBS/CBS da aquisição (0–100).
    # 100 = crédito integral (não-cumulatividade — LC 214/2025, art. 47). O crédito
    # presumido nas aquisições de produtor rural não contribuinte (arts. 164+) depende
    # de regulamentação futura — ajustar aqui quando editada, sem recompilar.
    credito:
      percentual-aproveitamento: 100

# Log base. Nunca logar senha/token — ver application-prod.yml para nivel de prod.
logging:
  level:
    root: INFO
    br.com.agrocontabil: INFO
