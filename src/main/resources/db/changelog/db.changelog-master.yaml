# Changelog raiz do Liquibase.
# Cada migration vira um arquivo em db/changelog/changes/ e e incluido aqui em ordem.
databaseChangeLog:
  - changeSet:
      id: 0000-baseline
      author: supersonic-team
      comment: Baseline vazio. Marca o inicio do versionamento do schema.
      changes: []
  - include:
      file: db/changelog/changes/0001-initial-schema.xml
  - include:
      file: db/changelog/changes/0002-nota-fiscal.xml
  - include:
      file: db/changelog/changes/0003-nota-fiscal-item-ibs-cbs.xml
  - include:
      file: db/changelog/changes/0004-nota-fiscal-xml-gerado.xml
  - include:
      file: db/changelog/changes/0005-nota-fiscal-tipo-documento.xml
  - include:
      file: db/changelog/changes/0006-ncm-cfop-referencia.xml
  - include:
      file: db/changelog/changes/0007-nota-fiscal-importacao.xml
