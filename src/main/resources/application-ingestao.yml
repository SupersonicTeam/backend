# Profile INGESTAO — comando de ingestao da legislacao da Ceres (issue #156).
# Usar junto com o profile do banco (ex.: dev,ingestao). Sobe sem servidor web e sem os jobs,
# roda o IngestaoLegislacaoRunner e encerra. Nunca exposto como endpoint.
spring:
  main:
    web-application-type: none
  # Um lote de embeddings do bge-m3 em CPU passa dos 120s do read-timeout do chat (a LC 214 falhou
  # no trecho 2.150). A ingestao e offline: timeout proprio, generoso.
  http:
    client:
      read-timeout: ${AI_INGESTAO_READ_TIMEOUT:10m}

app:
  nfe:
    sefaz:
      sync:
        enabled: false
  apuracao:
    fechamento:
      enabled: false
  guia-fiscal:
    sync:
      enabled: false
