# Profile HOMOLOG — ambiente de validacao antes de producao.
#
# Espelha o PROD na infraestrutura (banco por env, sem docker-compose, nenhum segredo literal) e
# na autenticacao: so JWT. Difere em dois pontos deliberados:
#   1. o DataLoader semeia dois produtores e um contador, para o cenario multi-usuario da issue #91;
#      com SEED_SENHA definida eles ganham credencial e entram pelo POST /api/auth/login. O
#      MockIdentidadeFilter (X-Usuario-Id) NAO existe aqui desde a #221: convivendo com o login real,
#      ele tomava qualquer conta pelo UUID, sem senha;
#   2. logs mais verbosos, porque homologacao existe para diagnosticar.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Tamanho e timeouts do pool vem do application.yml base (issue #98).
      # Aqui fica apenas o que e especifico do PostgreSQL: o statement_timeout do servidor,
      # que aborta a query presa no banco — o driver H2 dos testes rejeitaria esta propriedade.
      data-source-properties:
        options: -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}

  docker:
    compose:
      # Banco gerenciado externamente, como em producao.
      enabled: false

  jpa:
    show-sql: false

# CORS restrito as origens de homologacao (env obrigatoria — nunca "*").
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  # Senha das contas semeadas (#206). Vazia = seed sem credencial; precisa passar na politica.
  seed:
    senha: ${SEED_SENHA:}

# Health SEM detalhes, como em producao.
#
# O application.yml base usa "when-authorized", que em dev basta: dev e local. Aqui, mesmo sem o
# mock (#221), "autorizado" seria qualquer conta cadastrada — e o cadastro e publico —, entao o
# health detalhado (datasource, disco, componentes) ficaria aberto a quem criasse uma conta.
# Diagnostico em homologacao sai pelo log, que ja e DEBUG.
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    br.com.agrocontabil: DEBUG
    # Ceres em INFO (#499): nada do historico da continuidade, da reescrita nem da reconferencia
    # pode chegar ao log, nem em DEBUG.
    br.com.agrocontabil.assistente: INFO
