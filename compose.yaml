services:
  postgres:
    # PostgreSQL 16 com a extensao pgvector: a base de legislacao da Ceres (issue #156) mora no
    # mesmo banco. Trocar de postgres:16-alpine (musl) para esta imagem (Debian/glibc) muda a
    # collation: num volume de dev ja existente, recrie o volume (docker compose down -v; o seed do
    # DataLoader recompoe os dados) ou rode REINDEX DATABASE antes de confiar em indices de texto.
    image: 'pgvector/pgvector:0.8.6-pg16'
    container_name: agrocontabil-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-agrocontabil}
      POSTGRES_USER: ${DB_USER:-agrocontabil}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - agrocontabil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-agrocontabil} -d ${DB_NAME:-agrocontabil}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Ceres — modelo de linguagem local (issue #141). Fora do compose padrao de dev: so sobe com o
  # profile "ia" (ou "full"), para quem trabalha em NF-e nao baixar ~4 GB de modelos. Sem ele o
  # backend sobe normal, a Ceres responde 503 e o health fica DEGRADED.
  #   docker compose --profile ia up -d            # so Postgres + Ollama (backend pelo mvnw)
  #   docker compose --profile full up -d --build  # tudo, inclusive o backend
  ollama:
    profiles:
      - ia
      - full
    image: 'ollama/ollama:0.35.0'
    container_name: agrocontabil-ollama
    # Somente loopback: o Ollama nao tem autenticacao, e publicar a porta em 0.0.0.0 entregaria o
    # modelo (e a CPU/GPU da maquina) a qualquer um na rede. O backend do compose chega pela rede
    # interna (http://ollama:11434).
    ports:
      - '127.0.0.1:${AI_OLLAMA_PORT:-11434}:11434'
    volumes:
      - agrocontabil_ollama:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

  # Baixa os modelos na primeira subida e termina (idempotente: modelo ja baixado e so conferido).
  # Substitui o pull-model-strategy do Spring AI, que bloquearia a subida do backend por minutos e o
  # impediria de subir com o Ollama fora do ar. O embedding (bge-m3) e fixo: trocar o modelo
  # obriga a reindexar a legislacao.
  ollama-init:
    profiles:
      - ia
      - full
    image: 'ollama/ollama:0.35.0'
    container_name: agrocontabil-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b-instruct}
    # O embedding vem primeiro e sempre: e obrigatorio qualquer que seja o provedor de chat. O modelo
    # de chat so e baixado quando o chat e local — com provedor por API, AI_CHAT_MODEL e um nome da
    # API (ex.: gpt-4o-mini), que o Ollama nao tem. $$ escapa a interpolacao do compose.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama pull bge-m3 &&
        if [ "$$AI_CHAT_PROVIDER" = "ollama" ]; then ollama pull "$$AI_CHAT_MODEL"; fi
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  # Antivirus dos anexos das pendencias (issue #227). Fora do compose padrao de dev (o clamd usa
  # ~1,5 GB de RAM com as assinaturas carregadas): so sobe com o profile "antivirus" (ou "full").
  # Sem ele o dev roda com ANTIVIRUS_MODO=SEM_VERIFICACAO (padrao do application-dev.yml).
  #   docker compose --profile antivirus up -d clamav   # e ANTIVIRUS_MODO=CLAMAV no backend
  # A imagem ja traz as assinaturas; o freshclam do proprio container as atualiza. A primeira
  # subida leva ~1 min (clamd carregando a base): ate la o backend deixa os anexos em verificacao.
  clamav:
    profiles:
      - antivirus
      - full
    image: 'clamav/clamav:1.4.3'
    container_name: agrocontabil-clamav
    # Somente loopback: o clamd nao tem autenticacao. O backend do compose chega pela rede
    # interna (clamav:3310).
    ports:
      - '127.0.0.1:${ANTIVIRUS_PORTA:-3310}:3310'
    volumes:
      - agrocontabil_clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    profiles:
      - full
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrocontabil-backend
    # O default do Docker e 10s, que mataria o processo antes da janela de 30s do graceful
    # shutdown (issue #101). 35s da folga para o Tomcat drenar as requisicoes e os jobs
    # agendados terminarem.
    stop_grace_period: 35s
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agrocontabil}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-agrocontabil}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      AI_OLLAMA_BASE_URL: http://ollama:11434
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b-instruct}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com}
      AI_API_COMPLETIONS_PATH: ${AI_API_COMPLETIONS_PATH:-/v1/chat/completions}
      ANTIVIRUS_MODO: CLAMAV
      ANTIVIRUS_HOST: clamav
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/actuator/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  agrocontabil_pgdata:
  agrocontabil_ollama:
  agrocontabil_clamav:
